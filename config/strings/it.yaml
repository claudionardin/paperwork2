# Fixed strings, Italian. Templates never contain literal text, they look it up here.
# Placeholders use the same {{...}} syntax as the clause bodies.

# Used to build {{supplier.identification}} and {{client.identification}}.
# The renderer picks the first case that the party data supports.
identification:
  with_vat: con numero di partita IVA {{vat_number}} e sede in {{address}}
  with_tax_code: con codice fiscale {{tax_code}} e sede in {{address}}
  address_only: con sede in {{address}}

# Dual signature block appended to an offer when the frontmatter has `signature: true`.
signature:
  intro: >-
    Le Parti accettano i termini e le condizioni sopra indicati, come comprovato dalle
    rispettive sottoscrizioni:
  supplier_party: (Fornitore)
  client_party: (Cliente)
  representative_of: "{{role}} di {{party}}"    # e.g. "Legale rappresentante di Axelered d.o.o."
  signed_on: "Firmato in data:"
  empty_date: __ / __ / ____

# Testi fissi di pagamento e consegna. Le frasi sono le stesse per qualsiasi emittente; solo il
# numero di giorni è un dato dell'emittente, e sta in config/issuers/<id>.yaml sotto `defaults`.
# `within` riceve {{days}}.
terms:
  payment:
    within: Si prega di effettuare il pagamento entro {{days}} giorni dalla data di emissione tramite bonifico bancario a
    already_paid: Il presente documento è già stato saldato per intero. Nessun importo è dovuto.
  delivery:
    within: Entro {{days}} giorni dalla data di emissione
    already_delivered: Consegna già effettuata

# Stampato in fondo a ogni pagina, sopra la riga di registro dell'emittente.
# TODO far confermare la traduzione italiana dell'informativa di riservatezza: è testo
# contrattuale, e questa versione è una traduzione dell'inglese, non un testo approvato.
footer:
  confidentiality: >-
    Le informazioni contenute nel presente documento sono riservate e destinate esclusivamente
    al destinatario indicato.

# Titoli dei documenti, per tipo.
titles:
  "off": Offerta        # tra virgolette: off nudo e un booleano per un parser YAML 1.1
  spc: Specifica Tecnica
  pin: Fattura Proforma
  inv: Fattura
  cmr: Lettera di Vettura CMR

# Come si leggono i numeri in questa lingua. Gli importi hanno sempre due decimali, cambiano
# solo i separatori. L'italiano raggruppa col punto e segna i decimali con la virgola: 1.234,56.
number_format:
  thousands: "."
  decimal: ","

# Etichette fisse usate dai template.
# Le due intestazioni di parte usano le stesse parole delle clausole: Fornitore e Cliente.
labels:
  supplier: "Fornitore:"
  client: "Cliente:"
  description: Descrizione
  unit_price: Prezzo unitario
  quantity: Quantità
  price: Importo
  subtotal: Imponibile
  vat: IVA
  total: Totale
  headed_to: Intestato a
  iban: IBAN
  swift: SWIFT/BIC
  delivery_destination: Destinazione
  delivery_terms: Termini di consegna
  page: Pagina
  vat_number: "P. IVA"
  tax_code: "Codice fiscale"
  reg_number: "N. registro"
  valid_until: "Valida fino al"
  share_capital: capitale sociale
  entered_on: iscritta il

