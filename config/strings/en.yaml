# Fixed strings, English. Templates never contain literal text, they look it up here.
# Placeholders use the same {{...}} syntax as the clause bodies.
# The wording of the identification sentence and of the signature block is the one of the
# signed offer SDS24-01F, so that clause 1 reads exactly as it does in the original contract.

# Used to build {{supplier.identification}} and {{client.identification}}.
# The renderer picks the first case that the party data supports. The sentence follows the
# party name directly, with no comma: "Axelered d.o.o. with a VAT number of ... and an
# address of ...".
identification:
  with_vat: with a VAT number of {{vat_number}} and an address of {{address}}
  with_tax_code: with a tax code of {{tax_code}} and an address of {{address}}
  address_only: with an address of {{address}}

# Dual signature block appended to an offer when the frontmatter has `signature: true`.
# The defined terms are "Supplier" and "Client", as in the English clauses.
# The two columns carry the same three fields in the same order — who signs, in what capacity,
# where and when — so each party states the same things. The supplier's are printed, the
# client's are left blank for a hand to complete.
signature:
  intro: >-
    The Parties agree to the terms and conditions set forth above as demonstrated by their
    signatures as follows:
  supplier_party: (Supplier)
  client_party: (Client)
  label_name: "Full name:"
  label_title: "Title:"
  label_place_date: "Place and date:"

# Payment and delivery boilerplate. The same for any issuer; only the number of days is an
# issuer fact, and it lives in config/issuers/<id>.yaml under `defaults`. `within` receives
# {{days}}. Both are terms, not sentences: they are printed as the value of a `Terms` label,
# beside each other, so the two read the same way.
terms:
  payment:
    within: Within {{days}} days of the issue date, by bank transfer
    already_paid: Paid in full, nothing due
  delivery:
    within: Within {{days}} days of the issue date
    already_delivered: Already delivered

# Printed at the foot of every page, above the issuer's registry line.
footer:
  confidentiality: >-
    The information contained in these documents is confidential, privileged and only
    for the information of the intended recipient.

# Document titles, keyed by document type.
titles:
  "off": Offer          # quoted: bare off is a boolean to a YAML 1.1 parser
  spc: Technical Specification
  pin: Proforma Invoice
  inv: Invoice
  cmr: CMR Consignment Note

# How numbers read in this language. Amounts are always two decimals; only the separators
# change. English groups with a comma and marks the decimals with a point: 1,234.56.
number_format:
  thousands: ","
  decimal: "."

# Fixed labels used by the templates.
# The two party headings name the same parties the clauses define, and use the same two words:
# Supplier and Client. One party, one name, everywhere on the sheet.
labels:
  supplier: "Supplier:"
  client: "Client:"
  description: Description
  unit_price: Unit price
  quantity: Quantity
  price: Price
  subtotal: Subtotal
  vat: VAT
  total: Total Price
  payment: Payment
  delivery: Delivery
  terms: Terms
  headed_to: Headed to
  iban: IBAN
  swift: SWIFT/BIC
  destination: Destination
  page: Page
  vat_number: "VAT no."
  tax_code: "Tax code"
  reg_number: "Reg. no."
  valid_until: "Valid until"
  share_capital: share capital
  entered_on: entered on

