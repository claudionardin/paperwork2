# VAT clause wording, per case, per language.
# The engine picks a case key, then prints the wording in the document language plus the
# Slovenian wording when the case is an exemption.
#
# STATUS: PROVISIONAL WORDING, NOT VALIDATED BY AN ACCOUNTANT.
# The texts below were promoted from the draft comments of the first commit so that the
# generator works end to end. They follow common Slovenian practice and cite the articles
# named in CLAUDE.md section 8, but nobody has reviewed them. Have them checked before the
# first document goes out, then delete this note. See TODO.md.

rates:
  standard: 22.0
  reduced: 9.5
  super_reduced: 5.0

cases:

  domestic:
    # SI to SI, any kind. Taxable, no clause.
    taxable: true
    clause: null

  eu_b2b_goods:
    # Valid EU VAT ID, goods leaving Slovenia.
    taxable: false
    clause:
      sl: "Oproščeno DDV po 1. točki 46. člena ZDDV-1."
      en: "VAT exempt intra-Community supply of goods under Article 138(1) of Council Directive 2006/112/EC."
      it: "Operazione non imponibile, cessione intracomunitaria ai sensi dell'art. 138, par. 1, della Direttiva 2006/112/CE."

  eu_b2b_service:
    # Valid EU VAT ID, general place of supply rule, reverse charge.
    taxable: false
    clause:
      sl: "DDV ni obračunan po 1. odstavku 25. člena ZDDV-1, obrnjena davčna obveznost."
      en: "Reverse charge: VAT to be accounted for by the recipient under Articles 44 and 196 of Council Directive 2006/112/EC."
      it: "Inversione contabile: imposta assolta dal destinatario ai sensi degli artt. 44 e 196 della Direttiva 2006/112/CE."

  eu_b2c:
    # No valid VAT ID. Slovenian VAT applies.
    taxable: true
    clause: null

  non_eu_b2c:
    # A consumer outside the EU. Any B2C sale carries Slovenian VAT, wherever the buyer lives.
    taxable: true
    clause: null

  export_goods:
    # Goods leaving the EU.
    taxable: false
    clause:
      sl: "Oproščeno DDV po 52. členu ZDDV-1."
      en: "VAT exempt export of goods under Article 146 of Council Directive 2006/112/EC."
      it: "Operazione non imponibile, esportazione ai sensi dell'art. 146 della Direttiva 2006/112/CE."

  non_eu_service:
    # Services to a business established outside the EU.
    taxable: false
    clause:
      sl: "DDV ni obračunan po 1. odstavku 25. člena ZDDV-1."
      en: "Not subject to Slovenian VAT: place of supply outside Slovenia under Article 44 of Council Directive 2006/112/EC."
      it: "Operazione fuori campo IVA slovena: luogo della prestazione fuori dalla Slovenia ai sensi dell'art. 44 della Direttiva 2006/112/CE."

  public_administration:
    # Slovenian public administration. Taxable. e-invoicing via UJP is already mandatory.
    taxable: true
    clause: null
