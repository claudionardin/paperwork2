# Issuer profile — Axelered d.o.o., Slovenia. Selected by `issuer: "axelered_si"` on a
# document; the file name is the id.
#
# WHAT BELONGS HERE, AND WHAT DOES NOT
#   this file            facts about who issues the document: names, address, tax ids, bank
#                        accounts, house defaults, registry footer. Changes when the issuer
#                        changes, never when the language changes.
#   strings/<lang>.yaml  every fixed sentence and label printed on a document. Changes when
#                        the language changes, never when the issuer changes.
#
# A field that varies on BOTH axes — a fragment of prose that names this issuer — carries a
# per-language map here. There are exactly two: `signatory.role` and `legal.governing_law`.
# Anything else bilingual in this file is a bug.
#
# Proper names — cities, courts, registries — stay in their original language and are never
# translated. `Sežana`, `Okrožno sodišče v Kopru`, not their English renderings.

legal_name: Axelered D.o.o.
display_name: Axelered D.o.o.
address:
  street: Partizanska cesta 82
  postal_code: "6210"
  city: Sežana
  country: SI
vat_number: SI71451331
reg_number: "9247238000"
place_of_issue: Sežana

# Which rule set in lib/vat.typ applies, and which config/tax/<regime>.yaml holds the wording.
# It follows from address.country and is written out so the coupling is visible.
tax_regime: si

# Who signs on behalf of the issuer. Used by the signature block, never hardcoded in a template.
signatory:
  name: Claudio Nardin
  role:                             # bilingual on purpose: a fact about this person, translated
    en: Legal representative
    it: Legale rappresentante

# Referenced by the governing_law clause. A second issuer profile overrides these without
# touching the clause text.
legal:
  governing_law:                    # completes "regolato dalla legge ..." / "governed by ... law"
    en: Slovenian
    it: slovena
  forum: Okrožno sodišče v Kopru, Koper, Slovenia

contacts:
  website: www.axelered.com
  email: hi@axelered.com
  phone: "+386 64 298 884"

# The registry line in the page footer, printed after the legal name and joined with " · ".
# `label` is a key of `labels` in config/strings/<lang>.yaml; omit it for a value that stands
# on its own. Which entries exist is the issuer's business — a company registered elsewhere
# lists whatever its own register requires.
footer:
  registry:
    - label: share_capital
      value: 7.500,00 €
    - value: Okrožno sodišče v Kopru
    - value: SRG 2022/68810
    - label: entered_on
      value: "2022-10-26"

# Bank details belong to the issuer, not to the document. `default: true` marks the account
# used when a document names none; a document picks another with `bank-account: "<id>"`.
bank_accounts:
  - id: revolut
    holder: Axelered Doo
    iban: LT16 3250 0543 9293 9319
    swift: REVOLT21
    default: true

defaults:
  currency: "€"
  language: en
  pay_within: 10                    # days; a document may override it, 0 means already paid
  deliver_within: 10                # days; used when a document carries goods, 0 means delivered
