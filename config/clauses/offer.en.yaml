# Offer and contract clauses, English.
#
# Same schema, same ids, same weights and same order as offer.it.yaml. See that file for the
# description of the fields and of the {{...}} placeholders.
#
# SOURCE: these bodies are the original English contract text, transcribed verbatim from the
# signed offer SDS24-01F (2025-04-28), clauses 1..23. Do not rewrite, reword or "improve" them.
# The only edits made to the original are:
#   - party names, VAT numbers and addresses replaced by {{...}} placeholders (clause 1),
#     "Slovenian" replaced by {{supplier.governing_law}} (clause 22);
#   - the sentence "This Document has 7 pages." dropped from clause 23: it was a hand-typed
#     count that nothing on a generated document can keep true.
# The defined terms are "Provider" and "Client", as in the original. The section names quoted
# inside the clauses ("delivery and deliverables", "exclusions", "offer", "attachments") must
# match the headings actually used in the English offer body.
#
# The block is fixed: all 23 clauses are printed, in this order, on every offer.

sections:
  - id: contract
    title: THE AGREEMENT
    weight: 10
  - id: collaboration
    title: COLLABORATION & ACCESS
    weight: 20
  - id: ip
    title: INTELLECTUAL PROPERTY
    weight: 30
  - id: payment
    title: PAYMENT
    weight: 40
  - id: changes
    title: MODIFICATION & TERMINATION
    weight: 50
  - id: other
    title: OTHER
    weight: 60

clauses:
  - id: contract
    section: contract
    weight: 10
    title: Agreement
    body: |
      This agreement, when duly signed by both parties, becomes a legally binding Sales Agreement and is entered into on the last date of signature (the "Effective Date"). This agreement, by and between {{supplier.legal_name}} {{supplier.identification}} (the "Provider") and {{client.legal_name}} {{client.identification}} (the "Client"), also individually referred to as "Party", and collectively "Parties".

  - id: subject
    section: contract
    weight: 20
    title: Scope
    body: |
      This Agreement governs the sale of a service by the Provider to the Client. The outcome of this performance will be what listed "delivery and deliverables" that will be duly delivered by the Provider to the Client in the form and within the terms described within the same section, and better described in other sections of this document. Any other activity is excluded with particular attention to what is listed in the "exclusions" section.

  - id: collaboration
    section: collaboration
    weight: 30
    title: Collaboration
    body: |
      Both parties agree that given the nature of the service the Provider service strongly relies on Client collaboration, who should promptly reply to any Provider inquiry and offer any reasonable support needed to use and understand the current state-of-the-art.

  - id: systems
    section: collaboration
    weight: 40
    title: Systems
    body: |
      The client should grant the Provider any required access to technologies and architectures (Systems) owned or controlled by the Client and/or any third party on its behalf. Such a System shall remain in function and accessible to the Provider for the entire duration of the performance.

  - id: state_of_the_art_access
    section: collaboration
    weight: 50
    title: Access to state-of-the-art
    body: |
      When existing, the Client should grant Provider access to any asset and knowledge related to the current state-of-the-art (including but not limited to code, documentation, or design) and should provide any additional information or infrastructure necessary to use, understand, or test the current state-of-the-art. This includes direct contact with anyone who has been involved with the conceptualization, design, or realisation of the state-of-the-art.

  - id: third_party_systems
    section: collaboration
    weight: 60
    title: Third-party systems
    body: |
      Any third-party system required for the performance of the service should be obtained by the Client and made accessible to the Provider for the entire duration of the performance, free of charge. The Provider will not pay for, nor subscribe-on-behalf-of, for any such system. Any such system that may be required has been mentioned in this document (unless otherwise explicitly stated) and the Client herein declares to have evaluated and be aware of such expenses.

  - id: intellectual_property
    section: ip
    weight: 70
    title: Intellectual Property
    body: |
      The result of the performed service will remain the Provider's intellectual property until the client performs the due payment in full. Both parties agree that after such an event the Provider will release the intellectual property to the Client who will become the sole owner.

  - id: third_party_ip
    section: ip
    weight: 80
    title: Third-Party Intellectual Property
    body: |
      If the Provider uses or licences intellectual property owned by third parties in the performance of the service, it is the Provider's responsibility to inform the Client who shall verify the licence terms and obtain and maintain any such licences and authorizations as necessary. This condition also applies to open-source intellectual property licensed under any licence.

  - id: confidentiality
    section: ip
    weight: 90
    title: Confidentiality
    body: |
      Each Party shall maintain confidentiality of all such confidential information, and without obtaining the written consent of the other Party, it shall not disclose any relevant confidential information to any third parties, except for the information that: (a) is or will be in the public domain (other than through the receiving Party's unauthorised disclosure); (b) is under the obligation to be disclosed pursuant to the applicable laws or regulations, rules of any stock exchange, or orders of the court or other government authorities; or (c) is required to be disclosed, by any Party, to its shareholders, investors, legal counsels or financial advisors regarding the transaction contemplated hereunder, provided that such shareholders, investors, legal counsels or financial advisors shall be bound by the confidentiality obligations similar to those set forth in this Section. Disclosure of any confidential information by the staff members or agencies hired by any Party shall be deemed disclosure of such confidential information by such Party, which Party shall be held liable for breach of this Agreement. This Section shall survive the termination of this Agreement for any reason.

  - id: fixed_price
    section: payment
    weight: 100
    title: Fixed Price
    body: |
      When applicable, The Fixed Price quote implies that no additional cost beyond the quote can be charged by the Provider in case the quoted price for the Service does not reflect the actual costs faced during the performance of the Service. In the event of any Modification to this agreement or any of the requirements mentioned herein, the Fixed Price shall be waived or renegotiated. For the Price estimate, the Provider has relied on information provided by the Client (or other authorised personnel on its behalf); in case any such information is not accurate or not true any Provider obligations regarding the Fixed Price shall be deemed inapplicable and the Provider may charge the Client with any additional cost faced during the performance of the service.

  - id: price
    section: payment
    weight: 110
    title: Price
    body: |
      The Provider agrees to sell to the Client the service for the price listed in the "offer" section. The Client accepts the sale and understands that due to its nature, the performance of the service is not refundable and in any case shall be paid.

  - id: amendments
    section: changes
    weight: 120
    title: Modification
    body: |
      No modification or alteration of this contract shall be considered as having been made unless done with consent by the Parties and fully executed in writing and duly signed by the Parties. Therefore, no modification can be made to the deliverables or the project specification unless explicitly agreed by both parties.

  - id: termination
    section: changes
    weight: 130
    title: Termination
    body: |
      This Agreement may be terminated at any time by either Party upon written notice to the other Party. The Client will be responsible for the payment of the service that has already been performed by the Provider. In case of termination, the due amount will be the full price of any completed deliverable and will be computed "pro rata temporis" for any uncompleted deliverable. This also applies when the outcome of the service is partial, rendered unusable, or lacks the properties described in "delivery and deliverables" due to termination.

  - id: service_start
    section: other
    weight: 140
    title: Service start
    body: |
      The service will start on the latter of this contract being duly signed by both Parties, all advanced payment being received by the Provider, and both Parties have agreed to start the Service and fully commit to ensuring its successful delivery.

  - id: delivery_terms
    section: other
    weight: 150
    title: Delivery terms
    body: |
      The Provider will deliver the deliverables within the terms as described in the section "delivery and deliverables". Different deliverables or alterations of the same (such as, but not limited to, lexical translations, change of programming language or optimizations) are not due unless explicitly agreed hereunder. Unless differently specified all the delivery terms are expressed in weeks counting since the Service start date.

  - id: delay_disclaimer
    section: other
    weight: 160
    title: Excuse for Delay or Failure to Perform
    body: |
      The Provider will not be liable to the Client for any delay, non-delivery, or default of this agreement due to labour disputes, delay, shortage of systems/services/goods required to perform the Service, malfunctions, fires, accidents, Acts of God, or any other causes outside of the Provider's control. The Provider shall notify the Client immediately upon realization that it will not be able to perform the Service or deliver the deliverables, as promised. Either Party may terminate this Agreement upon such notice.

  - id: no_warranty
    section: other
    weight: 170
    title: Disclaimer of Warranties
    body: |
      ANY DELIVERABLE WHEN ACCEPTED BY THE CLIENT IS OFFERED 'AS IS' AND IS DEEMED AS PROPERLY FUNCTIONING. THE PROVIDER DISCLAIMS ANY FUTURE RESPONSIBILITY DUE TO DEGRADATION, MISUSE OR ANY OTHER EVENT THAT MAY COMPROMISE THE EFFECTIVENESS OF WHAT IS DELIVERED. THE PROVIDER DISCLAIMS ANY WARRANTY AFTER THE INITIAL INTEGRATION.

  - id: liability_cap
    section: other
    weight: 180
    title: Limitation of Liability
    body: |
      UNDER NO CIRCUMSTANCES SHALL EITHER PARTY BE LIABLE TO THE OTHER PARTY OR ANY THIRD PARTY FOR ANY DAMAGES RESULTING FROM ANY PART OF THIS AGREEMENT SUCH AS, BUT NOT LIMITED TO, LOSS OF REVENUE, ANTICIPATED PROFIT, OR LOST BUSINESS, COSTS OF DELAY OR FAILURE OF DELIVERY, WHICH ARE NOT RELATED TO OR THE DIRECT RESULT OF A PARTY'S NEGLIGENCE OR BREACH.

  - id: severability
    section: other
    weight: 190
    title: Severability
    body: |
      In the event any provision of this Agreement is deemed invalid or unenforceable, in whole or in part, that part shall be severed from the remainder of the Agreement and all other provisions shall continue in full force and effect as valid and enforceable.

  - id: waiver
    section: other
    weight: 200
    title: Waiver
    body: |
      The failure by either Party to exercise any right, power, or privilege under the terms of this Agreement will not be construed as a waiver of any subsequent or future exercise of that right, power, or privilege or the exercise of any other right, power, or privilege.

  - id: validity
    section: other
    weight: 210
    title: Legal and Binding Agreement
    body: |
      This Agreement is legal and binding between the Parties as stated above. This Agreement may be entered into and is legal and binding both throughout Europe and in the United States. The Parties each represent that they have the authority to enter into this Agreement.

  - id: governing_law
    section: other
    weight: 220
    title: Governing Law and Jurisdiction
    body: |
      The Parties agree that this Agreement shall be governed by the State or Country in which both Parties do business. If the Parties do business in different States and/or Countries, this Agreement shall be governed by {{supplier.governing_law}} law.

  - id: entire_agreement
    section: other
    weight: 230
    title: Entire Agreement and Completeness
    body: |
      This Agreement is delivered as part of a "quote" or "report" document (the "Document") and may include attachments (the "Attachments") as listed in the section "attachments". This Agreement refers to such Document in its entirety including all Attachments and cannot be signed or interpreted without them. Both Parties hereby declare that they have read and comprehend the entire Document and all Attachments, and sign this Agreement to accept the Document in its entirety and all Attachments. The Parties acknowledge and agree that this Agreement represents the entire agreement between the Parties. If the Parties desire to change, add, or otherwise modify any terms, they shall do so in writing to be signed by both Parties.
